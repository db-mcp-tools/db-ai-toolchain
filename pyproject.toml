[project]
name = "db-ai-toolchain"
version = "0.1.0"
description = "数据库生态 AI 工具链：6 个 MCP / 85 个工具，覆盖体检、变更、值守、迁移、口径治理"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }

dependencies = [
    "mcp>=1.0",
    "sqlglot>=20.0",
]

[project.optional-dependencies]
drivers = [
    "pymysql>=1.1",
    "psycopg[binary]>=3.1",
    "oracledb>=1.4",
    "clickhouse-connect>=0.7",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["dbcore"]

[tool.setuptools.package-dir]
dbcore = "packages/dbcore"

# 内核与 MCP 都不装包也能跑：用 PYTHONPATH=packages;. 或直接 python -m
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["packages", "."]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
